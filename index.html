<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Code Runner by Cyber Anxhu</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            color: #c9d1d9;
            margin-bottom: 15px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            flex-shrink: 0;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            height: calc(100vh - 100px);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .panel-title {
            font-weight: bold;
            color: #8b949e;
            margin-bottom: 10px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .terminal-box {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            background-color: #0d1117;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #30363d;
        }

        .cursor {
            display: inline-block;
            background-color: #58a6ff;
            width: 8px;
            height: 16px;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .run-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .run-btn:hover {
            background-color: #2ea043;
        }

        .output-box {
            flex-grow: 1;
            background-color: #0d1117;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #30363d;
            overflow-y: auto;
            white-space: pre-wrap;
            color: #7ee787;
            font-size: 14px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
        }

        .output-content {
            flex-grow: 1;
            white-space: pre-wrap;
        }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        .input-line input {
            background: transparent;
            border: none;
            color: #7ee787;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            outline: none;
            width: 100px;
            margin-left: 5px;
            border-bottom: 1px solid #7ee787;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>C++ Code Runner by Cyber Anxhu</h2>
    </div>

    <div class="container">
        <!-- Left Panel: Custom Typer Effect -->
        <div class="panel">
            <div class="panel-title">Terminal Typer (Press any key)</div>
            <div class="terminal-box" id="terminal">
                <span id="code-output"></span><span class="cursor"></span>
            </div>
        </div>

        <!-- Right Panel: Interactive Script Runner -->
        <div class="panel">
            <div class="panel-title">
                <span>C++ Compiler & Runner</span>
                <button class="run-btn" onclick="startProgram()">Run Code ▶</button>
            </div>
            
            <div class="panel-title" style="margin-top: 5px; margin-bottom: 2px;">Source Code (Auto-grasped from GitHub folder):</div>
            <div class="terminal-box" id="display-code" style="height: 40%; color: #58a6ff;">Scanning source-code folder...</div>

            <div class="panel-title" style="margin-top: 10px; margin-bottom: 2px;">Console Output:</div>
            <div id="compiler-output" class="output-box">
                <div id="output-text" class="output-content">Click 'Run Code' to execute...</div>
                <div id="input-container" class="input-line" style="display: none;">
                    <span id="prompt-label"></span>
                    <input type="number" id="user-input" autofocus onkeypress="handleInput(event)">
                </div>
            </div>
        </div>
    </div>

    <script>
        let customCode = "";

        // Automatically fetch whatever file is inside the source-code folder on GitHub
        async function loadScriptFromGitHub() {
            try {
                // Replace with your actual GitHub username and repo name
                const apiUrl = 'https://api.github.com/repos/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME/contents/source-code';
                
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Could not access repository folder.");
                
                const files = await response.json();
                
                // Locate the first .cpp file in that folder automatically
                const targetFile = files.find(file => file.name.endsWith('.cpp'));
                if (!targetFile) throw new Error("No .cpp file found in the folder.");

                // Fetch the code content from the file's direct download link
                const codeResponse = await fetch(targetFile.download_url);
                customCode = await codeResponse.text();
                
                document.getElementById('display-code').textContent = customCode;
            } catch (error) {
                customCode = "// Error: Make sure your GitHub username and repository name are updated in index.html";
                document.getElementById('display-code').textContent = customCode;
            }
        }

        loadScriptFromGitHub();

        // --- Left Panel Custom Typer Logic ---
        let currentIndex = 0;
        const outputElement = document.getElementById('code-output');
        const terminal = document.getElementById('terminal');
        const charsPerPress = 3;

        document.addEventListener('keydown', function(event) {
            if (event.key === " " || event.key === "Tab") {
                event.preventDefault();
            }

            if (customCode && currentIndex < customCode.length) {
                const chunk = customCode.substr(currentIndex, charsPerPress);
                outputElement.textContent += chunk;
                currentIndex += charsPerPress;
                terminal.scrollTop = terminal.scrollHeight;
            }
        });

        // --- Right Panel Interactive Execution Logic ---
        function startProgram() {
            if (!customCode || customCode.startsWith("// Error")) {
                alert("Source code has not loaded successfully from GitHub yet.");
                return;
            }

            const outputText = document.getElementById('output-text');
            const inputContainer = document.getElementById('input-container');
            const userInput = document.getElementById('user-input');
            const promptLabel = document.getElementById('prompt-label');

            outputText.textContent = "Compiling program...\n";
            inputContainer.style.display = 'none';

            setTimeout(() => {
                outputText.textContent = "Compilation successful.\n\n";
                promptLabel.textContent = "Enter the number of terms: ";
                inputContainer.style.display = 'flex';
                userInput.value = '';
                userInput.focus();
            }, 500);
        }

        function handleInput(event) {
            if (event.key === 'Enter') {
                const inputContainer = document.getElementById('input-container');
                const userInput = document.getElementById('user-input');
                const outputText = document.getElementById('output-text');
                
                const n = parseInt(userInput.value);
                if (isNaN(n) || n < 0) {
                    alert("Please enter a valid positive integer!");
                    return;
                }

                inputContainer.style.display = 'none';
                outputText.textContent += `Enter the number of terms: ${n}\n`;

                let t1 = 0, t2 = 1, nextTerm;
                let result = "Fibonacci Series: ";

                for (let i = 1; i <= n; ++i) {
                    result += t1 + " ";
                    nextTerm = t1 + t2;
                    t1 = t2;
                    t2 = nextTerm;
                }

                outputText.textContent += result + "\n\nProgram exited with code 0.";
            }
        }
    </script>

</body>
</html>
