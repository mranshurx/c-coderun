<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Code Runner by Cyber Anxhu</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            color: #c9d1d9;
            margin-bottom: 15px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            flex-shrink: 0;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            height: calc(100vh - 100px);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .panel-title {
            font-weight: bold;
            color: #8b949e;
            margin-bottom: 10px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .terminal-box {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            background-color: #0d1117;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #30363d;
        }

        .cursor {
            display: inline-block;
            background-color: #58a6ff;
            width: 8px;
            height: 16px;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        textarea.terminal-box {
            width: 100%;
            resize: none;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            outline: none;
            box-sizing: border-box;
        }

        .run-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .run-btn:hover {
            background-color: #2ea043;
        }

        .output-box {
            flex-grow: 1;
            background-color: #0d1117;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #30363d;
            overflow-y: auto;
            white-space: pre-wrap;
            color: #7ee787;
            font-size: 14px;
            margin-top: 10px;
            height: 40%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>C++ Code Runner by Cyber Anxhu</h2>
    </div>

    <div class="container">
        <!-- Left Panel: Custom Typer Effect -->
        <div class="panel">
            <div class="panel-title">Hacker Typer (Press any key)</div>
            <div class="terminal-box" id="terminal">
                <span id="code-output"></span><span class="cursor"></span>
            </div>
        </div>

        <!-- Right Panel: Functional C++ Compiler & Runner -->
        <div class="panel">
            <div class="panel-title">
                <span>Interactive C++ Runner</span>
                <button class="run-btn" onclick="compileAndRun()">Run Code ▶</button>
            </div>
            <textarea id="user-code" class="terminal-box" spellcheck="false">#include <iostream>
using namespace std;

int main() {
    cout << "Hello from Cyber Anxhu Runner!" << endl;
    return 0;
}</textarea>
            <div class="panel-title" style="margin-top: 10px; margin-bottom: 5px;">Output:</div>
            <div id="compiler-output" class="output-box">Click 'Run Code' to execute...</div>
        </div>
    </div>

    <script>
        // --- Left Panel Custom Typer Logic ---
        const customCode = `#include <iostream>
using namespace std;

int main() {
    int n;
    long t1 = 0, t2 = 1, nextTerm;

    cout << "Enter the number of terms: ";
    cin >> n;

    cout << "Fibonacci Series: ";

    for (int i = 1; i <= n; ++i) {
        cout << t1 << " ";
        nextTerm = t1 + t2;
        t1 = t2;
        t2 = nextTerm;
    }

    return 0;
}`;

        let currentIndex = 0;
        const outputElement = document.getElementById('code-output');
        const terminal = document.getElementById('terminal');
        const charsPerPress = 3;

        document.addEventListener('keydown', function(event) {
            // Prevent typing trigger if user is focused inside the interactive textarea on the right
            if (document.activeElement.id === 'user-code') return;

            if (event.key === " " || event.key === "Tab") {
                event.preventDefault();
            }

            if (currentIndex < customCode.length) {
                const chunk = customCode.substr(currentIndex, charsPerPress);
                outputElement.textContent += chunk;
                currentIndex += charsPerPress;
                terminal.scrollTop = terminal.scrollHeight;
            }
        });

        // --- Right Panel Compiler & Execution Logic (Using Judge0/Piston API) ---
        async function compileAndRun() {
            const code = document.getElementById('user-code').value;
            const outputDiv = document.getElementById('compiler-output');
            
            outputDiv.textContent = "Compiling and running...";

            try {
                // Using the open-source Piston code execution API
                const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        language: "cpp",
                        version: "10.2.0",
                        files: [
                            {
                                content: code
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.run) {
                    let resultText = data.run.output;
                    if (data.run.stderr) {
                        resultText += "\n[Errors]:\n" + data.run.stderr;
                    }
                    outputDiv.textContent = resultText || "Program executed with no output.";
                } else {
                    outputDiv.textContent = "Execution failed.";
                }
            } catch (error) {
                outputDiv.textContent = "Error connecting to execution server: " + error.message;
            }
        }
    </script>

</body>
</html>
